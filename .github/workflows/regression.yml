name: Chatbot regression

on:
  workflow_dispatch:        # manual trigger
  schedule:
    - cron: '0 12 * * 1'    # Mondays at 12:00 UTC

jobs:
  regression:
    name: Run regression suite against Gemini
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit summary.csv
      pull-requests: write  # if peter-evans/create-pull-request is used
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run regression suite (Gemini)
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
        run: npm run regression:gemini

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ github.run_id }}
          path: backend/regression/reports/report-*.json
          retention-days: 90

      - name: Commit updated summary.csv
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/regression/reports/summary.csv
          if ! git diff --cached --quiet; then
            git commit -m "regression: append weekly summary"
            git push
          else
            echo "No summary changes to commit."
          fi
